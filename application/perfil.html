<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoLog — Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo" style="text-decoration:none">AutoLog</a>
  <div class="nav-search">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Buscar @usuário…">
  </div>
  <button class="btn-login">Login</button>
</nav>

<!-- BANNER -->
<div class="banner-wrap">
  <img class="banner-img"
       src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=1400&q=80"
       alt="Banner do perfil">
  <div class="banner-overlay"></div>
  <div class="banner-stripe"></div>
</div>

<!-- PROFILE HEADER -->
<div class="profile-header">
  <div class="profile-top">
    <div class="avatar-wrap">
      <img class="avatar"
           src="https://api.dicebear.com/7.x/bottts/svg?seed=default&backgroundColor=1a1a1f"
           alt="Avatar">
      <div class="avatar-status"></div>
    </div>
    <div class="profile-info">
      <div class="profile-name">—</div>
      <div class="profile-handle">@—</div>
      <div class="profile-bio">Carregando…</div>
      <div class="profile-stats">
        <div class="stat">
          <span class="stat-num" id="car-count">0</span>
          <span class="stat-label">Carros</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- AUTOMÓVEIS -->
<div class="section">
  <div class="section-header">
    <h2 class="section-title">Automóveis</h2>
    <a href="cadastrocarro.html" class="btn-add">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Adicionar Carro
    </a>
  </div>
  <div class="cars-grid" id="cars-grid"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <div class="toast-icon">🏎️</div>
  <div class="toast-msg">
    <div class="toast-title">Carro cadastrado!</div>
    <div class="toast-sub" id="toast-sub">Adicionado com sucesso.</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
